repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: basedpyright
        name: BasedPyright
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
