[project]
name = "asterion-sdk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["asterion-ccsds", "asterion-mdb", "asterion-xtce"]

[tool.uv.sources]
asterion-ccsds = { workspace = true }
asterion-mdb = { workspace = true }
asterion-xtce = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "hypothesis>=6.130",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.coverage.run]
branch = true
source = ["asterion.ccsds", "asterion.mdb", "asterion.xtce"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
# The formatter may intentionally produce long lines. E501 would conflict with it.
ignore = ["E501"]

[tool.basedpyright]
include = [
    "packages/asterion-ccsds/src",
    "packages/asterion-ccsds/tests",
    "packages/asterion-mdb/src",
    "packages/asterion-mdb/tests",
    "packages/asterion-xtce/src",
    "packages/asterion-xtce/tests",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
# Public models retain runtime guards for callers that do not use a type checker.
reportUnnecessaryIsInstance = "none"
