[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterion-ccsds"
version = "0.1.0"
description = "Typed CCSDS Space Packet encoding and decoding"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Asterion Systems" }]
dependencies = []

[tool.hatch.build.targets.wheel]
only-include = ["src/asterion/ccsds"]
sources = ["src"]
