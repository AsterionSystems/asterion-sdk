[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterion-mdb"
version = "0.1.0"
description = "Protocol-neutral mission database models and telemetry decoding"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Asterion Systems" }]
keywords = ["mission-control", "telemetry", "xtce", "scos-2000"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AsterionSystems/asterion-sdk"
Issues = "https://github.com/AsterionSystems/asterion-sdk/issues"

[tool.hatch.build.targets.wheel]
only-include = ["src/asterion/mdb"]
sources = ["src"]
